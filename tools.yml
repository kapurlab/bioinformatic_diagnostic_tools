# tools.yml — the Kapur Lab tool suite manifest (single source of truth).
#
# Each entry pins one tool repo to a version (a git tag). The umbrella CLI
# (`bdtools`) reads this file to install, update, and report on the suite.
# Tagging THIS repo (e.g. `suite-2026.06`) pins the entire set for a fully
# reproducible deployment.
#
# Fields per tool:
#   name      tool id and default checkout dir name
#   repo      git clone URL (https for public, unauthenticated installs)
#   version   git ref to deploy — a tag (preferred) or a branch
#   ood_apps  the PRODUCTION batch_connect app dir name(s) under <tool>/ood/apps/
#             — these are what every user sees in the dashboard (the only cards
#             a normal `install --server` renders).
#   dev_apps  the DEVELOPER-only card(s) (the git branch-picker `<tool>_dev`).
#             Never installed by default; only with `install --server --with-dev`.
#             Optional — omit for tools that ship no dev card.
#   env       the conda env name the tool builds (informational)
#   databases named reference-DB requirements the installer stages (optional)
#   packages  the ANALYSIS packages whose version a diagnostic user needs to know,
#             pinned exactly:  [<channel>::<name>=<version>, ...]      (optional)
#   packages_held  packages that a newer release exists for but THIS env cannot
#             take (another package in the same env holds perl/zlib/libcurl down).
#             Still shown, never offered as an update.               (optional)
#   updates   whether bdtools may CHANGE this tool:
#               install — offered in the dashboard, and `bdtools update` /
#                         `update-packages` will act on it
#               report  — versions are read and displayed, and nothing is ever
#                         installed, rebuilt or moved  (the DEFAULT when absent)
#
# EVERY TOOL IS OPTED IN (2026-08-20). The dashboard shows each tool's newest
# release, so an update that then refuses to apply contradicts the screen: the
# version a dashboard shows and the version an update produces must be the same
# thing. `bdtools update all` — and the dashboard's update button — therefore
# acts on the whole suite.
#
# From 2026-08-06 to 2026-08-20 everything but vsnp_gui was report-only, after
# an update-all rebuilt kraken_id_parse_gui on macOS, died on an upstream spades
# post-link script, and left a working install broken through no fault of the
# tool. What makes all-in acceptable now is that the safety lives in the
# mechanism instead of the default: each tool updates in its own subshell (one
# failure never abandons the rest), a build that dies is recorded and retried
# rather than reported as current, and every env change snapshots first
# (`bdtools restore-env <tool>` puts the previous package set back). A GUI
# update also cannot move the science: analysis packages change only through
# the exact `packages:` pins below, which the installer re-enforces after every
# rebuild.
#
# `updates: report` remains supported to freeze one tool deliberately (e.g.
# mid-validation, or an install being debugged): its versions are still read
# and shown, nothing about it is changed, and the dashboard offers no button
# for it. Acting on a frozen tool is one named tool at a time:
#     bin/bdtools update <tool> --allow-report-only
#
# Why `packages` is pinned here and not left to each tool's environment.yml: those
# floor-pin (`mlst>=2.23`) or leave the version open, so what you got depended on
# the day the env was built — the same suite release produced mlst 2.33.1 on one
# machine and 2.35.0 on another. An exact pin makes a build reproducible, and it
# gives `bdtools check-updates` something to compare the channel against, so a new
# bioconda release shows up on the dashboard instead of going unnoticed.
#
# The installer enforces these pins after building the env; the dashboard shows
# installed-vs-newest per tool. Bump one deliberately (and re-run the install for
# that tool) rather than letting a rebuild drift.
#
# CROSS-PLATFORM CONSISTENCY OUTRANKS VERSION CURRENCY. Pin the newest version that
# is installable everywhere the lab deploys, not the newest that exists. Two machines
# disagreeing about what produced a result is worse than both being a release behind.
#
# A pin must also EXIST on every platform the lab deploys to. mlst is the cautionary
# case: 2.34.0 and 2.35.0 are noarch, and still cannot be installed on macOS, because
# they depend on libxcrypt1 — which has no macOS build. Pinning 2.35.0 made every Mac
# install warn and every Mac dashboard offer an update that could never apply. 2.33.1
# is the newest mlst that exists for both, so that is what the suite runs everywhere;
# one version across the lab is the point of pinning at all.
#
# A pin set must be JOINTLY SOLVABLE — verify before committing one:
#     bin/bdtools update-packages <tool> --dry-run     (solves, installs nothing)
# Pinning each package to the newest on its channel independently does NOT work in
# a coupled env, and produced exactly that failure here: ncbi-amrfinderplus=4.2.7
# with kraken2=2.17.1 and mlst=2.35.0 is unsatisfiable at any version of anything.
#
# All tools carry a baseline tag (vsnp_gui v0.2.0; the rest v0.1.0, cut
# 2026-06-16). Bump a pin with `bdtools update <tool>` once newer tags exist.

suite_version: "2026.08.13"

tools:
  - name: vsnp_gui
    repo: https://github.com/kapurlab/vsnp_gui.git
    version: v0.4.69
    updates: install
    ood_apps: [vsnp_gui]
    dev_apps: [vsnp_gui_dev]
    env: vsnp3
    databases: [vsnp3_refs]
    packages: [bioconda::vsnp3=3.36, bioconda::snp-dists=1.2.0]

  - name: amr_plus_gui
    repo: https://github.com/kapurlab/amr_plus_gui.git
    version: v0.3.11
    updates: install
    ood_apps: [amr_plus_gui]
    dev_apps: [amr_plus_gui_dev]
    env: amr_plus
    databases: [amrfinder_db]
    # mlst and kraken2 are deliberately NOT here. Each runs from its own tool's
    # env (mlst_gui, kraken_id_parse_gui), invoked through
    # BDTOOLS_SIBLING_ENV_<TOOL>, so every analysis package is pinned exactly
    # once suite-wide. Sharing one env is what capped it: mlst pulls
    # perl-bioperl -> perl-bio-samtools, holding perl and zlib down, which had
    # pinned this env to ncbi-amrfinderplus 3.12.8 and kraken2 2.1.3 — and that
    # kraken2 kept running here long after kraken_id_parse_gui moved to 2.17.1,
    # two versions of one tool live in the same suite.
    #
    # 3.12.8 could not read the deployed AMRFinder database at all — the 4.x layout
    # renamed AMRProt to AMRProt.fa, so the old binary reports "the BLAST database
    # for AMRProt was not found", and its own default DB path points into a conda
    # build directory that does not exist. Matching the binary to the database that
    # is actually deployed is what makes this the stable version, not the bold one.
    #
    # NOTE: an env built before the splits may still physically contain mlst
    # and kraken2. The pipeline prefers the sibling envs, so the stale copies
    # simply stop being used; a rebuild sheds them:
    #     bin/bdtools install amr_plus_gui --rebuild
    packages: [bioconda::ncbi-amrfinderplus=4.2.7]

  - name: irma_gui
    repo: https://github.com/kapurlab/irma_gui.git
    version: v0.3.13
    updates: install
    ood_apps: [irma_gui]
    dev_apps: [irma_gui_dev]
    env: irma_gui
    # genoflu is deliberately NOT here: it runs from genoflu_gui's env via
    # BDTOOLS_SIBLING_ENV_GENOFLU_GUI (the amr_plus/mlst arrangement), so the
    # suite pins GenoFLU once, below — two pins of one package are two copies
    # that can drift. An env built before the split may still contain a
    # genoflu; the runner prefers the sibling env, and a rebuild sheds it.
    packages: [bioconda::irma=1.3.5]

  - name: genoflu_gui
    repo: https://github.com/kapurlab/genoflu_gui.git
    version: v0.3.8
    updates: install
    ood_apps: [genoflu_gui]
    dev_apps: [genoflu_gui_dev]
    env: genoflu_gui
    # GenoFLU's suite-wide pin. irma_gui also runs genoflu from THIS env
    # (BDTOOLS_SIBLING_ENV_GENOFLU_GUI) — bumping it moves both tools together.
    packages: [bioconda::genoflu=1.07]

  - name: mlst_gui
    repo: https://github.com/kapurlab/mlst_gui.git
    version: v0.3.9
    updates: install
    ood_apps: [mlst_gui]
    dev_apps: [mlst_gui_dev]
    env: mlst
    packages: [bioconda::mlst=2.33.1]
    # 2.34.0 and 2.35.0 exist and are noarch, and can never be installed on macOS:
    # they depend on libxcrypt1, which has no macOS build. Declared held so the
    # suite says so straight away instead of offering the upgrade, spending minutes
    # on a solve, and refusing it — on every machine, once per machine. The version
    # is still read and displayed; held is not hidden.
    # Revisit when an mlst newer than 2.33.1 builds on macOS: the hold is by NAME,
    # so it suppresses every future release until it is removed. `bdtools versions`
    # keeps showing the newest one on the channel, and
    # `update-packages mlst_gui --to mlst=<ver>` overrides the hold by hand.
    packages_held: [mlst]

  - name: kraken_id_parse_gui
    repo: https://github.com/kapurlab/kraken_id_parse_gui.git
    version: v0.2.19
    updates: install
    ood_apps: [kraken_id_parse_gui]
    dev_apps: [kraken_id_parse_gui_dev]
    env: kraken_id_parse
    databases: [kraken2_db]
    # kraken2's suite-wide pin. amr_plus_gui also runs kraken2 from THIS env
    # (BDTOOLS_SIBLING_ENV_KRAKEN_ID_PARSE_GUI) — bumping it moves both tools
    # together.
    packages: [bioconda::kraken2=2.17.1, bioconda::krakentools=1.2.1]

  # No `packages`: kSNP4 is not a conda package. It is a vendored SourceForge zip
  # unpacked into the checkout, so its version travels with the tool release.
  - name: ksnp_gui
    repo: https://github.com/kapurlab/ksnp_gui.git
    version: v0.5.6
    updates: install
    ood_apps: [ksnp_gui]
    dev_apps: [ksnp_gui_dev]
    env: ksnp

  - name: ncbi_submit_gui
    repo: https://github.com/kapurlab/ncbi_submit_gui.git
    version: v0.2.7
    updates: install
    ood_apps: [ncbi_submit_gui]
    dev_apps: [ncbi_submit_gui_dev]
    env: ncbi_submit

  # Under active development. Results are preliminary and not yet validated for
  # diagnostic use (see the development notice on its dashboard card): DRB3 is
  # production-ready, Class I calls are provisional. Has its own dedicated conda
  # env (like every other tool) with the full ONT amplicon toolchain; the BoLA
  # reference bundle ships in-repo.
  - name: mhc_gui
    repo: https://github.com/kapurlab/bovine_mhc_typer.git
    version: v0.2.4
    updates: install
    ood_apps: [mhc_gui]
    dev_apps: [mhc_gui_dev]
    env: mhc_gui
