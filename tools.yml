# tools.yml — the Kapur Lab tool suite manifest (single source of truth).
#
# Each entry pins one tool repo to a version (a git tag). The umbrella CLI
# (`bdtools`) reads this file to install, update, and report on the suite.
# Tagging THIS repo (e.g. `suite-2026.06`) pins the entire set for a fully
# reproducible deployment.
#
# Fields per tool:
#   name      tool id and default checkout dir name
#   repo      git clone URL (https for public, unauthenticated installs)
#   version   git ref to deploy — a tag (preferred) or a branch
#   ood_apps  the PRODUCTION batch_connect app dir name(s) under <tool>/ood/apps/
#             — these are what every user sees in the dashboard (the only cards
#             a normal `install --server` renders).
#   dev_apps  the DEVELOPER-only card(s) (the git branch-picker `<tool>_dev`).
#             Never installed by default; only with `install --server --with-dev`.
#             Optional — omit for tools that ship no dev card.
#   env       the conda env name the tool builds (informational)
#   databases named reference-DB requirements the installer stages (optional)
#   packages  the ANALYSIS packages whose version a diagnostic user needs to know,
#             pinned exactly:  [<channel>::<name>=<version>, ...]      (optional)
#   packages_held  packages that a newer release exists for but THIS env cannot
#             take (another package in the same env holds perl/zlib/libcurl down).
#             Still shown, never offered as an update.               (optional)
#
# Why `packages` is pinned here and not left to each tool's environment.yml: those
# floor-pin (`mlst>=2.23`) or leave the version open, so what you got depended on
# the day the env was built — the same suite release produced mlst 2.33.1 on one
# machine and 2.35.0 on another. An exact pin makes a build reproducible, and it
# gives `bdtools check-updates` something to compare the channel against, so a new
# bioconda release shows up on the dashboard instead of going unnoticed.
#
# The installer enforces these pins after building the env; the dashboard shows
# installed-vs-newest per tool. Bump one deliberately (and re-run the install for
# that tool) rather than letting a rebuild drift.
#
# A pin set must be JOINTLY SOLVABLE — verify before committing one:
#     bin/bdtools update-packages <tool> --dry-run     (solves, installs nothing)
# Pinning each package to the newest on its channel independently does NOT work in
# a coupled env, and produced exactly that failure here: ncbi-amrfinderplus=4.2.7
# with kraken2=2.17.1 and mlst=2.35.0 is unsatisfiable at any version of anything.
#
# All tools carry a baseline tag (vsnp_gui v0.2.0; the rest v0.1.0, cut
# 2026-06-16). Bump a pin with `bdtools update <tool>` once newer tags exist.

suite_version: "2026.08.04"

tools:
  - name: vsnp_gui
    repo: https://github.com/kapurlab/vsnp_gui.git
    version: v0.4.36
    ood_apps: [vsnp_gui]
    dev_apps: [vsnp_gui_dev]
    env: vsnp3
    databases: [vsnp3_refs]
    packages: [bioconda::vsnp3=3.35, bioconda::snp-dists=1.2.0]

  - name: amr_plus_gui
    repo: https://github.com/kapurlab/amr_plus_gui.git
    version: v0.3.2
    ood_apps: [amr_plus_gui]
    dev_apps: [amr_plus_gui_dev]
    env: amr_plus
    databases: [amrfinder_db]
    # These three are the joint solution of this env's spec, confirmed with a
    # fresh dry-run solve — not the newest of each. `mlst` transitively requires
    # perl-bioperl -> perl-bio-samtools, which holds perl and zlib down, and that
    # caps ncbi-amrfinderplus at 3.12.8 and kraken2 at 2.1.3 HERE. Newer exists
    # (4.2.7 / 2.17.1) and both are shown, but neither can be installed into this
    # env, so they are held rather than offered forever.
    #   Dropping mlst from amr_plus would free both (mlst_gui has its own env with
    #   mlst 2.35.0) — a change to the amr_plus_gui spec, not something to pin around.
    packages: [bioconda::ncbi-amrfinderplus=3.12.8, bioconda::kraken2=2.1.3, bioconda::mlst=2.35.0]
    packages_held: [ncbi-amrfinderplus, kraken2]

  - name: irma_gui
    repo: https://github.com/kapurlab/irma_gui.git
    version: v0.3.2
    ood_apps: [irma_gui]
    dev_apps: [irma_gui_dev]
    env: irma_gui
    packages: [bioconda::irma=1.3.5, bioconda::genoflu=1.07]

  - name: genoflu_gui
    repo: https://github.com/kapurlab/genoflu_gui.git
    version: v0.3.2
    ood_apps: [genoflu_gui]
    dev_apps: [genoflu_gui_dev]
    env: genoflu_gui
    packages: [bioconda::genoflu=1.07]

  - name: mlst_gui
    repo: https://github.com/kapurlab/mlst_gui.git
    version: v0.3.3
    ood_apps: [mlst_gui]
    dev_apps: [mlst_gui_dev]
    env: mlst
    packages: [bioconda::mlst=2.35.0]

  - name: kraken_id_parse_gui
    repo: https://github.com/kapurlab/kraken_id_parse_gui.git
    version: v0.2.3
    ood_apps: [kraken_id_parse_gui]
    dev_apps: [kraken_id_parse_gui_dev]
    env: kraken_id_parse
    databases: [kraken2_db]
    packages: [bioconda::kraken2=2.17.1, bioconda::krakentools=1.2.1]

  # No `packages`: kSNP4 is not a conda package. It is a vendored SourceForge zip
  # unpacked into the checkout, so its version travels with the tool release.
  - name: ksnp_gui
    repo: https://github.com/kapurlab/ksnp_gui.git
    version: v0.5.0
    ood_apps: [ksnp_gui]
    dev_apps: [ksnp_gui_dev]
    env: ksnp

  - name: ncbi_submit_gui
    repo: https://github.com/kapurlab/ncbi_submit_gui.git
    version: v0.2.2
    ood_apps: [ncbi_submit_gui]
    dev_apps: [ncbi_submit_gui_dev]
    env: ncbi_submit

  # Under active development. Results are preliminary and not yet validated for
  # diagnostic use (see the development notice on its dashboard card): DRB3 is
  # production-ready, Class I calls are provisional. Has its own dedicated conda
  # env (like every other tool) with the full ONT amplicon toolchain; the BoLA
  # reference bundle ships in-repo.
  - name: mhc_gui
    repo: https://github.com/kapurlab/bovine_mhc_typer.git
    version: v0.2.2
    ood_apps: [mhc_gui]
    dev_apps: [mhc_gui_dev]
    env: mhc_gui
